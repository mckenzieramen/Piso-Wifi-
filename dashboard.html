<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>PISO WIFI — Management System</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="authLoading" class="auth-loading"><div class="loader"></div><span>Checking authentication…</span></div>
  <div id="app" class="app hidden">
    <aside class="sidebar" id="sidebar">
      <div class="brand premium-brand">
        <div class="brand-mark small premium-logo" aria-label="PISO WIFI logo">
          <svg viewBox="0 0 48 48" aria-hidden="true">
            <circle cx="24" cy="24" r="22" fill="url(#pwLogoGrad)"/>
            <path d="M11.5 20.2c7-6.8 18-6.8 25 0" fill="none" stroke="white" stroke-width="3.2" stroke-linecap="round"/>
            <path d="M16.2 25.2c4.4-4.1 11.2-4.1 15.6 0" fill="none" stroke="white" stroke-width="3.2" stroke-linecap="round"/>
            <circle cx="24" cy="31.5" r="2.8" fill="white"/>
            <defs><linearGradient id="pwLogoGrad" x1="8" y1="6" x2="40" y2="42" gradientUnits="userSpaceOnUse"><stop stop-color="#4db2ff"/><stop offset="1" stop-color="#0b5ddd"/></linearGradient></defs>
          </svg>
        </div>
        <div><strong>PISO WIFI</strong><span>Management System</span></div>
      </div>
      <nav class="nav" id="nav" aria-label="Main navigation">
        <a href="#dashboard" data-route="dashboard"><span class="nav-icon"><svg viewBox="0 0 24 24"><path d="M4 11.5 12 5l8 6.5V20a1 1 0 0 1-1 1h-5v-6H10v6H5a1 1 0 0 1-1-1z"/></svg></span>Dashboard</a>
        <a href="#units" data-route="units"><span class="nav-icon"><svg viewBox="0 0 24 24"><path d="M4 20V8l8-4 8 4v12M8 20v-5h8v5M9 9h.01M15 9h.01"/></svg></span>Units / Clients</a>
        <a href="#reports" data-route="reports"><span class="nav-icon"><svg viewBox="0 0 24 24"><path d="M5 20V10M12 20V4M19 20v-7"/></svg></span>Monthly Reports</a>
        <a href="#payments" data-route="payments"><span class="nav-icon"><svg viewBox="0 0 24 24"><path d="M4 7h16v12H4zM7 4h10M8 12h8M8 15h5"/></svg></span>Payments</a>
        <a href="#statements" data-route="statements"><span class="nav-icon"><svg viewBox="0 0 24 24"><path d="M7 3h8l4 4v14H7zM15 3v5h4M10 12h6M10 16h6"/></svg></span>Client Statements</a>
        <a href="#activity" data-route="activity"><span class="nav-icon"><svg viewBox="0 0 24 24"><path d="M4 12h4l2-5 4 10 2-5h4"/></svg></span>Activity Log</a>
        <a href="#settings" data-route="settings"><span class="nav-icon"><svg viewBox="0 0 24 24"><path d="M12 8.5A3.5 3.5 0 1 0 12 15.5 3.5 3.5 0 0 0 12 8.5Z"/><path d="m19 13 .2-1-.2-1 1.6-1.2-1.8-3.1-1.9.7a8 8 0 0 0-1.7-1L15 4h-6l-.2 2.4a8 8 0 0 0-1.7 1l-1.9-.7-1.8 3.1L5 11l-.2 1 .2 1-1.6 1.2 1.8 3.1 1.9-.7a8 8 0 0 0 1.7 1L9 20h6l.2-2.4a8 8 0 0 0 1.7-1l1.9.7 1.8-3.1z"/></svg></span>Settings</a>
        <a href="client-login.html" class="client-portal-link"><span class="nav-icon"><svg viewBox="0 0 24 24"><path d="M4 5.5A2.5 2.5 0 0 1 6.5 3h11A2.5 2.5 0 0 1 20 5.5v13a2.5 2.5 0 0 1-2.5 2.5h-11A2.5 2.5 0 0 1 4 18.5z"/><path d="M8 8h8M8 12h8M8 16h5"/></svg></span>Client Portal</a>
      </nav>
      <div class="sidebar-footer"><span class="wifi-mini premium-mini-logo"><svg viewBox="0 0 24 24"><path d="M4 9c4.5-4.3 11.5-4.3 16 0M7 12c2.8-2.7 7.2-2.7 10 0M10.5 15.5a2 2 0 0 1 3 0"/></svg></span><div><b>Connect · Earn</b><small>Grow Together</small></div></div>
      <button id="logoutBtn" class="logout-btn"><span class="nav-icon"><svg viewBox="0 0 24 24"><path d="M10 5H5v14h5M14 8l4 4-4 4M18 12H9"/></svg></span> Logout</button>
    </aside>
    <div class="overlay" id="overlay"></div>
    <main class="main">
      <header class="topbar">
        <button id="menuBtn" class="icon-btn" aria-label="Open menu">☰</button>
        <div class="welcome"><h2 id="welcomeTitle">Welcome, Admin!</h2><span id="welcomeSub">Overview of your Piso WiFi business.</span></div>
        <div class="top-search"><span>⌕</span><input id="globalSearch" placeholder="Search anything..." autocomplete="off"></div>
        <div class="top-actions">
          <label class="month-select"><span class="header-icon"><svg viewBox="0 0 24 24"><rect x="4" y="5" width="16" height="15" rx="2"/><path d="M8 3v4M16 3v4M4 9h16"/></svg></span><select id="globalMonth"></select></label>
          <div class="profile"><span class="avatar">AA</span><span><b>Admin</b><small id="userEmail">Owner</small></span><span>⌄</span></div>
        </div>
      </header>
      <section class="content" id="view"></section>
    </main>
  </div>
  <div id="toast" class="toast"></div>
  <div id="modalRoot"></div>
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script type="module" src="js/dashboard.js"></script>
</body>
</html>
