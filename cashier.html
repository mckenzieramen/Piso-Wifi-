<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PISO WIFI — Cashier Portal</title>
<link rel="stylesheet" href="/css/cashier.css?v=20261016-login-css-path-fix">
<style>
html,body{min-height:100%;margin:0}
body.cashier-login-page{font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:radial-gradient(ellipse at top left,#174832 0,#0a2018 48%,#06120e 100%);color:#effff4;display:grid;place-items:center;padding:20px;box-sizing:border-box}
.cashier-login-card{width:min(100%,430px);box-sizing:border-box;padding:30px;border:1px solid #28523c;border-radius:22px;background:linear-gradient(145deg,rgba(13,39,27,.98),rgba(7,24,17,.98));box-shadow:0 24px 70px rgba(0,0,0,.35)}
.cashier-login-card .cashier-logo{display:grid;place-items:center;width:46px;height:46px;border-radius:14px;background:#1e8b52;color:#fff;font-size:25px;font-weight:800}
.cashier-login-card h1{margin:18px 0 5px;font-size:28px;letter-spacing:-.6px;color:#f5fff8}
.cashier-login-card p{margin:0 0 24px;color:#a9cbb6}
.cashier-login-card form{display:grid;gap:14px}
.cashier-login-card label{display:grid;gap:7px;color:#d9f0e1;font-size:13px;font-weight:650}
.cashier-login-card input{width:100%;min-height:44px;box-sizing:border-box;border:1px solid #315b43;border-radius:11px;padding:10px 12px;background:#081b12;color:#f4fff7;font:inherit;outline:none}
.cashier-login-card input:focus{border-color:#39b875;box-shadow:0 0 0 3px rgba(57,184,117,.16)}
.cashier-login-card button.primary{min-height:45px;border:0;border-radius:11px;background:linear-gradient(135deg,#22a663,#087440);color:white;font-weight:750;font-size:14px;cursor:pointer}
.cashier-login-card .message{font-size:13px;color:#ffb8b8}
.cashier-login-card>small{display:block;margin-top:18px;color:#91b7a0;font-size:12px}
@media(max-width:480px){body.cashier-login-page{padding:14px}.cashier-login-card{padding:23px;border-radius:18px}}
</style>
</head>
<body class="cashier-login-page">
<main id="loginCard" class="cashier-login-card">
  <div class="cashier-logo">⌁</div><h1>PISO WIFI</h1><p>Secure Cashier Portal</p>
  <form id="loginForm">
    <label>Email Address<input id="email" type="email" autocomplete="username" required placeholder="cashier@email.com"></label>
    <label>Password<input id="password" type="password" autocomplete="current-password" required placeholder="Enter password"></label>
    <button class="primary" type="submit">Sign in to Cashier</button>
    <div id="loginMsg" class="message"></div>
  </form>
  <small>Cashier access only. Admin data is restricted.</small>
</main>
<script src="js/piso-branded-dialogs.js?v=20261015-branded-dialogs"></script>
  <script type="module" src="js/cashier.js?v=20261016-support-header-sound-fix"></script>
</body></html>
