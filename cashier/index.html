<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>PISO WIFI — Cashier Portal</title>
<link rel="stylesheet" href="/css/cashier.css">
</head>
<body class="cashier-login-page">
<main id="loginCard" class="cashier-login-card">
  <div class="cashier-logo">⌁</div><h1>PISO WIFI</h1><p>Secure Cashier Portal</p>
  <form id="loginForm">
    <label>Email Address<input id="email" type="email" autocomplete="username" required placeholder="cashier@email.com"></label>
    <label>Password<input id="password" type="password" autocomplete="current-password" required placeholder="Enter password"></label>
    <button class="primary" type="submit">Sign in to Cashier</button>
    <div id="loginMsg" class="message"></div>
  </form>
  <small>Cashier access only. Admin data is restricted.</small>
</main>
<script type="module" src="/js/cashier.js?v=20261010-2105"></script>
</body></html>
