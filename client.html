<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#062a4f">
<title>PISO WIFI — Client Dashboard</title>
<link rel="stylesheet" href="styles.css">
</head>
<body class="portal-page">
<div class="portal-app">
  <aside class="sidebar" id="sidebar">
    <div class="side-brand">
      <img src="assets/piso-wifi-logo.png" alt="PISO WIFI">
      <span>Client Portal</span>
    </div>
    <button class="mobile-close" id="closeMenu" aria-label="Close menu">×</button>
    <nav>
      <button class="nav-item active" data-view="dashboard">⌂ <span>Dashboard</span></button>
      <button class="nav-item" data-view="units">▣ <span>My Units</span></button>
      <button class="nav-item" data-view="sales">▤ <span>Sales History</span></button>
      <button class="nav-item" data-view="payments">▣ <span>Payments</span></button>
      <button class="nav-item" data-view="statement">▥ <span>Statement</span></button>
      <button class="nav-item" data-view="profile">◉ <span>Profile</span></button>
    </nav>
    <button class="logout" id="logout">↪ <span>Logout</span></button>
  </aside>

  <div class="drawer-overlay" id="drawerOverlay"></div>

  <section class="portal-main">
    <header class="topbar">
      <button class="hamburger" id="openMenu" aria-label="Open menu">☰</button>
      <div class="top-title">PISO WIFI <span>Client Portal</span></div>
      <div class="top-actions">
        <button class="bell" aria-label="Notifications">♧<b>1</b></button>
        <div class="avatar" id="avatar">JD</div>
        <div class="user-meta"><strong id="clientName">Juan Dela Cruz</strong><small>Client</small></div>
      </div>
    </header>

    <main class="content" id="content"></main>
  </section>
</div>

<script>
const state = {
  client: {name:'Juan Dela Cruz', id:'C-001', email:'juan@gmail.com', phone:'0912 345 6789', address:'Brgy. San Isidro, Antipolo', joined:'Jan 15, 2026'},
  unit: {code:'UNIT-001', location:'Brgy. San Isidro, Antipolo', status:'Online', installed:'Jan 15, 2026'},
  month:'September 2026',
  summary:{gross:10000, share:3000, deductions:1100, due:1900, internet:1000, electricity:100},
  sales:[
    ['September','₱10,000','₱1,000','₱100','₱3,000','₱1,900','Unpaid'],
    ['August','₱8,500','₱1,000','₱100','₱2,550','₱1,450','Paid'],
    ['July','₱12,300','₱1,000','₱100','₱3,690','₱2,590','Paid'],
    ['June','₱9,800','₱1,000','₱100','₱2,940','₱1,840','Paid'],
    ['May','₱11,200','₱1,000','₱100','₱3,360','₱2,260','Paid']
  ],
  payments:[
    ['Aug 05, 2026','₱1,450','GCash #12345','August 2026','Completed'],
    ['Jul 06, 2026','₱2,590','Cash','July 2026','Completed'],
    ['Jun 05, 2026','₱1,840','GCash #67890','June 2026','Completed'],
    ['May 07, 2026','₱2,260','Bank Transfer','May 2026','Completed']
  ]
};

const content = document.getElementById('content');
const esc = s => String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const money = n => '₱' + Number(n).toLocaleString('en-PH');

function dashboard(){
 content.innerHTML = `
  <div class="page-head"><div><h1>Hello, ${esc(state.client.name)}!</h1><p>Here's your summary for ${state.month}.</p></div><button class="select-btn">September 2026⌄</button></div>
  <section class="kpis">
    ${kpi('▥','Gross Sales',money(state.summary.gross),'green')}
    ${kpi('♟','Your Share (30%)',money(state.summary.share),'blue')}
    ${kpi('▤','Total Deductions',money(state.summary.deductions),'red')}
    ${kpi('▣','Amount Due',money(state.summary.due),'purple')}
  </section>
  <section class="two-col">
    <article class="card"><div class="card-title"><h2>My Piso WiFi Unit</h2></div>
      <div class="unit-row"><div class="wifi-box">⌁</div><div><strong>${state.unit.code}</strong><p>${state.unit.location}</p></div><span class="status online">${state.unit.status}</span></div>
      <div class="unit-meta"><span>Installed: <b>${state.unit.installed}</b></span><span>Status: <b>Active</b></span></div>
    </article>
    <article class="card"><div class="card-title"><h2>This Month's Breakdown</h2></div>
      ${breakdown('Gross Sales',money(state.summary.gross))}
      ${breakdown('Internet Fee',money(state.summary.internet))}
      ${breakdown('Electricity Share',money(state.summary.electricity))}
      ${breakdown('Your Share (30%)',money(state.summary.share))}
      <div class="breakdown total"><span>Amount Due</span><b>${money(state.summary.due)}</b></div>
    </article>
  </section>`;
}
function kpi(icon,label,value,kind){return `<article class="kpi ${kind}"><div class="kpi-icon">${icon}</div><div><strong>${value}</strong><span>${label}</span></div></article>`}
function breakdown(a,b){return `<div class="breakdown"><span>${a}</span><b>${b}</b></div>`}

function units(){
 content.innerHTML = `<div class="page-head"><div><h1>My Piso WiFi Units</h1><p>View the units assigned to your client account.</p></div></div>
 <div class="unit-grid"><article class="card unit-large"><div class="unit-row"><div class="wifi-box">⌁</div><div><strong>${state.unit.code}</strong><p>${state.unit.location}</p></div><span class="status online">${state.unit.status}</span></div><hr><div class="detail-grid"><div><small>Installation Date</small><b>${state.unit.installed}</b></div><div><small>Account Status</small><b>Active</b></div></div></article></div>`;
}
function sales(){
 content.innerHTML = `<div class="page-head"><div><h1>Sales History</h1><p>View your monthly sales and computations.</p></div><button class="select-btn">2026⌄</button></div>
 <div class="table-card"><div class="table-scroll"><table><thead><tr><th>Month</th><th>Gross Sales</th><th>Internet Fee</th><th>Electricity Share</th><th>Your Share (30%)</th><th>Amount Due</th><th>Status</th></tr></thead><tbody>
 ${state.sales.map(r=>`<tr>${r.map((c,i)=>`<td>${i===6?`<span class="status ${c.toLowerCase()}">${c}</span>`:c}</td>`).join('')}</tr>`).join('')}
 </tbody></table></div></div>`;
}
function payments(){
 content.innerHTML = `<div class="page-head"><div><h1>Payment History</h1><p>View your payments and remaining balance.</p></div></div>
 <div class="table-card"><div class="table-scroll"><table><thead><tr><th>Date Paid</th><th>Amount Paid</th><th>Reference</th><th>Month Covered</th><th>Status</th></tr></thead><tbody>
 ${state.payments.map(r=>`<tr>${r.map((c,i)=>`<td>${i===4?`<span class="status completed">${c}</span>`:c}</td>`).join('')}</tr>`).join('')}
 </tbody></table></div></div>`;
}
function statement(){
 content.innerHTML = `<div class="page-head"><div><h1>Statement</h1><p>Generate and download your statement.</p></div></div>
 <div class="statement-tools"><select><option>September</option><option>August</option><option>July</option></select><select><option>2026</option></select><button class="primary-btn small">Generate Statement</button></div>
 <article class="statement card"><div class="statement-head"><img src="assets/piso-wifi-logo.png"><div><strong>Client Statement</strong><small>${state.month}</small></div></div>
 <div class="statement-client"><span>Client Name <b>${esc(state.client.name)}</b></span><span>Client ID <b>${state.client.id}</b></span><span>Unit <b>${state.unit.code}</b></span><span>Location <b>${esc(state.unit.location)}</b></span></div>
 ${breakdown('Gross Sales',money(state.summary.gross))}${breakdown('Internet Fee',money(state.summary.internet))}${breakdown('Electricity Share',money(state.summary.electricity))}${breakdown('Your Share (30%)',money(state.summary.share))}<div class="breakdown total"><span>Amount Due</span><b>${money(state.summary.due)}</b></div>
 <div class="statement-actions"><button onclick="window.print()">Print</button><button class="primary-btn small" onclick="alert('Connect this button to the existing PDF generator.')">Download PDF</button></div></article>`;
}
function profile(){
 content.innerHTML = `<div class="page-head"><div><h1>My Profile</h1><p>View and update your account information.</p></div></div>
 <section class="profile-grid"><article class="card"><h2>Personal Information</h2><label>Full Name</label><input value="${esc(state.client.name)}"><label>Email Address</label><input value="${esc(state.client.email)}" disabled><label>Contact Number</label><input value="${esc(state.client.phone)}"><label>Address</label><input value="${esc(state.client.address)}"><button class="primary-btn">Update Profile</button></article>
 <article class="card"><h2>Account Information</h2><div class="info-line"><span>Client ID</span><b>${state.client.id}</b></div><div class="info-line"><span>Date Joined</span><b>${state.client.joined}</b></div><div class="info-line"><span>Status</span><b class="status online">Active</b></div><div class="info-line"><span>Assigned Unit</span><b>${state.unit.code}</b></div></article></section>`;
}
const views={dashboard,units,sales,payments,statement,profile};
document.querySelectorAll('.nav-item').forEach(btn=>btn.addEventListener('click',()=>{document.querySelectorAll('.nav-item').forEach(x=>x.classList.remove('active'));btn.classList.add('active');views[btn.dataset.view]();closeDrawer();}));
function closeDrawer(){document.getElementById('sidebar').classList.remove('open');document.getElementById('drawerOverlay').classList.remove('show');}
document.getElementById('openMenu').onclick=()=>{document.getElementById('sidebar').classList.add('open');document.getElementById('drawerOverlay').classList.add('show');};
document.getElementById('closeMenu').onclick=closeDrawer;
document.getElementById('drawerOverlay').onclick=closeDrawer;
document.getElementById('logout').onclick=()=>{sessionStorage.clear();location.href='client-login.html';};
dashboard();
</script>
</body>
</html>
