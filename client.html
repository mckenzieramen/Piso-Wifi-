<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0a2344">
  <title>PISO WIFI — Client Portal</title>
  <link rel="stylesheet" href="css/client.css">
</head>
<body class="client-app-page">
  <div id="clientAuthLoading" class="client-auth-loading"><div class="client-spinner"></div><span>Checking your client account…</span></div>
  <div id="clientApp" class="client-app hidden">
    <aside id="clientSidebar" class="client-sidebar">
      <div class="client-sidebar-brand"><span class="client-logo-mark"><svg viewBox="0 0 48 48"><path d="M7 20c10-9 24-9 34 0M12 26c7-6 17-6 24 0M18 32c3.5-3 8.5-3 12 0" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round"/><circle cx="24" cy="38" r="2.6" fill="currentColor"/></svg></span><span><b>PISO WIFI</b><small>Client Portal</small></span></div>
      <nav id="clientNav" class="client-nav" aria-label="Client navigation">
        <a href="#dashboard" data-route="dashboard"><span class="nav-icon">⌂</span>Dashboard</a>
        <a href="#units" data-route="units"><span class="nav-icon">⌁</span>My Units</a>
        <a href="#sales" data-route="sales"><span class="nav-icon">▤</span>Sales History</a>
        <a href="#payments" data-route="payments"><span class="nav-icon">₱</span>Payments</a>
        <a href="#statement" data-route="statement"><span class="nav-icon">▥</span>Statement</a>
        <a href="#profile" data-route="profile"><span class="nav-icon">●</span>Profile</a>
      </nav>
      <button id="clientLogout" class="client-logout"><span class="nav-icon">↪</span>Logout</button>
    </aside>
    <div id="clientOverlay" class="client-overlay"></div>
    <main class="client-main">
      <header class="client-topbar">
        <button id="clientMenuBtn" class="client-menu-btn" aria-label="Open menu">☰</button>
        <div class="client-mobile-context"><b>PISO WIFI</b><span>Client Portal</span></div>
        <div class="client-top-actions">
          <div class="notification-wrap" id="notificationWrap">
            <button id="notificationBtn" class="notification-btn" aria-label="Notifications">${`<svg viewBox="0 0 24 24"><path d="M18 9a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9M10 21h4"/></svg>`}<span id="notificationCount" class="notification-count hidden">0</span></button>
            <div id="notificationPopover" class="notification-popover"></div>
          </div>
          <div class="client-identity"><span id="clientAvatar" class="client-avatar">CL</span><span><b id="clientName">Client</b><small id="clientRole">Client</small></span></div>
        </div>
      </header>
      <section id="view" class="client-content"></section>
    </main>
  </div>
  <div id="clientToast" class="client-toast"></div>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script type="module" src="js/client.js"></script>
</body>
</html>
