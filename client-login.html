<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#062a4f">
<title>PISO WIFI — Client Portal</title>
<link rel="stylesheet" href="styles.css">
</head>
<body class="login-page">
<div class="login-shell">
  <section class="brand-panel" aria-label="PISO WIFI Client Portal">
    <div class="brand-inner">
      <img class="brand-logo" src="assets/piso-wifi-logo.png" alt="PISO WIFI">
      <div class="brand-copy">
        <h1>Client Portal</h1>
        <p>View your sales, payments and<br class="desktop-only"> personal records anytime,<br class="desktop-only"> anywhere.</p>
      </div>
      <img class="login-illustration" src="assets/login-illustration.png" alt="Client using a laptop">
    </div>
  </section>

  <main class="login-main">
    <div class="login-card">
      <div class="mobile-logo-wrap">
        <img src="assets/piso-wifi-logo.png" alt="PISO WIFI">
      </div>
      <div class="eyebrow">CLIENT PORTAL</div>
      <h2>Welcome, Client!</h2>
      <p class="login-subtitle">Log in to your account to view your Piso WiFi records.</p>

      <form id="clientLoginForm" novalidate>
        <label for="unitId">Unit ID / Login ID</label>
        <div class="input-wrap">
          <span class="input-icon" aria-hidden="true">⌁</span>
          <input id="unitId" name="unitId" type="text" inputmode="text" autocomplete="username"
                 placeholder="e.g. UNIT-001" required>
        </div>

        <label for="password">Password</label>
        <div class="input-wrap">
          <span class="input-icon" aria-hidden="true">●</span>
          <input id="password" name="password" type="password" autocomplete="current-password"
                 placeholder="Enter your password" required>
          <button class="eye-btn" id="togglePassword" type="button" aria-label="Show password">Show</button>
        </div>

        <div class="form-row">
          <button type="button" class="text-link" id="forgotBtn">Forgot Password?</button>
        </div>

        <button class="primary-btn" type="submit">Login</button>
        <div id="loginMessage" class="message" role="alert" aria-live="polite"></div>
      </form>

      <p class="account-help">Don't have an account? <button type="button" class="inline-link" id="contactAdmin">Contact Admin</button></p>
      <div class="secure-note">🔒 Secure client access · Your records are private to your account.</div>
    </div>
  </main>
</div>

<script>
const form = document.getElementById('clientLoginForm');
const password = document.getElementById('password');
const toggle = document.getElementById('togglePassword');
const message = document.getElementById('loginMessage');

toggle.addEventListener('click', () => {
  const show = password.type === 'password';
  password.type = show ? 'text' : 'password';
  toggle.textContent = show ? 'Hide' : 'Show';
  toggle.setAttribute('aria-label', show ? 'Hide password' : 'Show password');
});

document.getElementById('forgotBtn').addEventListener('click', () => {
  message.className = 'message info';
  message.textContent = 'Password recovery will use the email/contact method registered by Admin for your client account.';
});

document.getElementById('contactAdmin').addEventListener('click', () => {
  message.className = 'message info';
  message.textContent = 'Please contact the Piso WiFi administrator who created your client account.';
});

form.addEventListener('submit', (e) => {
  e.preventDefault();
  const unitId = document.getElementById('unitId').value.trim();
  const pass = password.value;
  if (!unitId || !pass) {
    message.className = 'message error';
    message.textContent = 'Please enter your Unit ID and password.';
    return;
  }
  /*
    Firebase integration hook:
    Replace this demo redirect with the existing Firebase Auth/client lookup.
    The authenticated UID MUST be mapped to the client/unit record server-side.
  */
  sessionStorage.setItem('pendingClientUnitId', unitId);
  window.location.href = 'client.html';
});
</script>
</body>
</html>
