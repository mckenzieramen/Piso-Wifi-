<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0b1730">
  <title>PISO WIFI — Management System</title>
  <link rel="stylesheet" href="../css/style.css">
<style>
.remember-row{display:flex;align-items:center;justify-content:flex-start;margin:10px 0 18px;font-size:13px;color:#64748b}.remember-row label{display:flex;align-items:center;gap:8px;cursor:pointer}.remember-row input{width:16px;height:16px;accent-color:#1677ff}.remember-row .text-link{margin-left:auto}.remember-row button{border:0;background:transparent;color:#1677ff;font-weight:700;cursor:pointer}
</style>
</head>
<body class="login-page">
  <main class="login-card" aria-labelledby="loginTitle">
    <div class="login-brand" aria-hidden="true">
      <div class="login-brand-mark">
        <svg viewBox="0 0 48 48" role="img">
          <path d="M8 19.5c11-10 21-10 32 0"/>
          <path d="M13.5 25c7.2-6.2 13.8-6.2 21 0"/>
          <path d="M19 30.2c3.4-2.8 6.6-2.8 10 0"/>
          <circle cx="24" cy="35.5" r="2" fill="currentColor" stroke="none"/>
        </svg>
      </div>
    </div>

    <h1 id="loginTitle">PISO WIFI</h1>
    <p>Management System</p>

    <form id="loginForm" novalidate>
      <div class="login-form-group">
        <label for="email">Email Address</label>
        <input id="email" type="email" autocomplete="email" required placeholder="admin@example.com">
      </div>

      <div class="login-form-group">
        <label for="password">Password</label>
        <div class="password-wrap">
          <input id="password" type="password" autocomplete="off" required placeholder="Enter your password">
          <button type="button" id="togglePassword" aria-label="Show password">Show</button>
        </div>
      </div>

      <div class="remember-row"><label><input id="rememberMe" type="checkbox"> <span>Remember me</span></label></div>

      <button class="primary-btn" type="submit">Log In</button>
      <button class="link-btn login-forgot" type="button" id="resetPassword">Forgot password?</button>
      <div id="loginMessage" class="login-message" role="status" aria-live="polite"></div>
    </form>

    <div class="login-footer">
      <strong>Connect · Earn · Grow Together</strong><br>
      Secure access to your Piso WiFi business management system.

    </div>
  </main>

  <script type="module" src="../js/auth.js"></script>
</body>
</html>
